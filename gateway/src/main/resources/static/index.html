<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciamento de Documentos</title>
<style>body{font:16px system-ui;background:#f3f5f8;color:#182638;margin:0}main{max-width:1000px;margin:auto;padding:32px}h1{font-size:28px}section{background:white;padding:22px;border:1px solid #dce2ea;border-radius:8px;margin:18px 0}label{display:block;margin:10px 0}input,textarea,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bac5d3;border-radius:4px;font:inherit}button{padding:10px 18px;border:0;border-radius:4px;background:#244f86;color:white;cursor:pointer;margin:8px 6px 0 0}button:disabled{opacity:.5}pre{white-space:pre-wrap;background:#f3f5f8;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}#mensagem{min-height:24px;white-space:pre-wrap}li{margin:12px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
<main><h1>Gerenciamento de Documentos</h1><p>Cadastro de modelos e documentos pessoais.</p><p><a href="http://localhost:8761" target="_blank" rel="noopener">Abrir painel Eureka</a></p><p id="mensagem" role="status" aria-live="polite"></p>
<section id="autenticacao"><h2>Acessar sistema</h2><form id="login"><label>Email<input id="email" type="email" required maxlength="200" autocomplete="username"></label><label>Senha<input id="senha" type="password" required minlength="8" maxlength="72" autocomplete="current-password"></label><button>Entrar</button></form><details><summary>Criar uma conta</summary><form id="cadastro"><label>Nome<input id="nome" required maxlength="100" autocomplete="name"></label><label>Email<input id="novoEmail" type="email" required maxlength="200" autocomplete="email"></label><label>Senha<input id="novaSenha" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label><button>Cadastrar</button></form></details></section>
<div id="sistema" hidden><p id="usuario"></p><button id="sair">Sair</button><div class="grid"><section><h2>Novo modelo</h2><form id="modelo"><label>Nome<input id="modeloNome" required maxlength="100"></label><label>Conteúdo<textarea id="modeloConteudo" required maxlength="20000" rows="5"></textarea></label><button>Cadastrar modelo</button></form></section><section><h2>Novo documento</h2><form id="documento"><label>Título<input id="titulo" required maxlength="150"></label><label>Modelo<select id="modelos" required></select></label><button>Criar documento</button></form></section></div><section><h2>Meus documentos</h2><button id="atualizar">Atualizar lista</button><ul id="documentos"></ul><pre id="conteudo" hidden></pre></section></div></main>
<script>
let token=null;const el=id=>document.getElementById(id);function mensagem(t){el('mensagem').textContent=t;}
async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const text=await r.text();let data;try{data=JSON.parse(text)}catch{data={}}if(!r.ok){if(r.status===401&&token){token=null;el('sistema').hidden=true;el('autenticacao').hidden=false;}throw Error(data.erro||({400:'Verifique os campos.',401:'Sessão ou credenciais inválidas.',403:'Acesso negado.',404:'Recurso não encontrado.',409:'Já existe um cadastro com esse nome ou email.',503:'Serviço indisponível. Aguarde o registro no Eureka.'}[r.status])||'Não foi possível concluir a operação.')}return data;}
function tarefa(fn){return async e=>{e.preventDefault();const button=e.target.querySelector('button');if(button)button.disabled=true;try{await fn();}catch(err){mensagem(err.message)}finally{if(button)button.disabled=false}}}
el('cadastro').onsubmit=tarefa(async()=>{await api('identidade/usuarios',{nome:el('nome').value,email:el('novoEmail').value,senha:el('novaSenha').value});el('email').value=el('novoEmail').value;el('cadastro').reset();mensagem('Conta cadastrada. Entre com email e senha.');});
el('login').onsubmit=tarefa(async()=>{const s=await api('identidade/login',{email:el('email').value,senha:el('senha').value});token=s.token;el('senha').value='';el('usuario').textContent='Usuário: '+s.usuario.nome;el('sistema').hidden=false;el('autenticacao').hidden=true;await atualizar();mensagem('Acesso realizado.');});
async function atualizar(){const modelos=await api('modelos');el('modelos').replaceChildren();for(const m of modelos){const o=document.createElement('option');o.value=m.id;o.textContent=m.nome+' (v'+m.versao+')';el('modelos').append(o)}const docs=await api('documentos');el('documentos').replaceChildren();if(!docs.length){const li=document.createElement('li');li.textContent='Nenhum documento cadastrado.';el('documentos').append(li)}for(const d of docs){const li=document.createElement('li');const b=document.createElement('button');b.textContent='Abrir '+d.titulo;b.onclick=async()=>{try{const doc=await api('documentos/'+encodeURIComponent(d.id));el('conteudo').hidden=false;el('conteudo').textContent=doc.titulo+'\n\n'+doc.conteudo;mensagem('Consulta autorizada.')}catch(err){mensagem(err.message)}};li.append(b);el('documentos').append(li)}}
el('modelo').onsubmit=tarefa(async()=>{await api('modelos',{nome:el('modeloNome').value,conteudo:el('modeloConteudo').value});el('modelo').reset();await atualizar();mensagem('Modelo cadastrado.');});el('documento').onsubmit=tarefa(async()=>{await api('documentos',{titulo:el('titulo').value,modeloId:el('modelos').value});el('titulo').value='';await atualizar();mensagem('Documento criado a partir do modelo.');});el('atualizar').onclick=tarefa(atualizar);el('sair').onclick=()=>{token=null;el('sistema').hidden=true;el('autenticacao').hidden=false;el('conteudo').textContent='';el('documentos').replaceChildren();mensagem('Sessão local encerrada.');};
</script></html>
