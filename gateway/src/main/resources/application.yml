spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identidade
              uri: lb://identidade
              predicates:
                - Path=/api/identidade/**
            - id: modelos
              uri: lb://modelos
              predicates:
                - Path=/api/modelos/**
            - id: documentos
              uri: lb://documentos
              predicates:
                - Path=/api/documentos/**
            - id: acesso
              uri: lb://acesso
              predicates:
                - Path=/api/acesso/**
server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: 8080
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: false
    hostname: ${SERVICE_HOST:localhost}
    lease-renewal-interval-in-seconds: 5
management:
  endpoints:
    web:
      exposure:
        include: health,info
