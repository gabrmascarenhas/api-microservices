spring:
  application:
    name: eureka-server
server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: 8761
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    response-cache-update-interval-ms: 3000
management:
  endpoints:
    web:
      exposure:
        include: health,info
